<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cetak Dokumen Payroll — PT. Yawiraya Bina Mandiri</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="../assets/img/logo-ybm.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.tailwindcss.com/3.4.5"></script>
  <script src="../assets/js/tailwind.config.js"></script>
  <style>
    body { font-family: 'Inter Tight', system-ui, sans-serif; }
    .page { width: 210mm; min-height: 148mm; margin: 0 auto 24px; background: #fff; padding: 12mm 14mm; position: relative; box-shadow: 0 2px 16px rgba(15,22,38,.08); }
    .page.a4 { min-height: 297mm; }
    .tbl { width: 100%; border-collapse: collapse; }
    .tbl th, .tbl td { padding: 4px 6px; font-size: 11px; }
    .tbl thead th { text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: #0F1626aa; border-bottom: 1.5px solid #0F1626; }
    .tbl tbody tr { border-bottom: 1px solid #0f16261a; }
    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .watermark { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; font-size: 64px; font-weight: 700; color: rgba(220, 38, 38, .08); transform: rotate(-24deg); letter-spacing: .1em; }
    @media print {
      @page { size: A4; margin: 0; }
      body { background: #fff !important; }
      .no-print { display: none !important; }
      .page { box-shadow: none; margin: 0; page-break-after: always; break-after: page; }
      .page:last-child { page-break-after: auto; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
  <script src="assets/payroll-engine.js"></script>
  <script src="assets/hris-data.js"></script>
  <script id="jsb" src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
</head>
<body class="bg-surface text-ink antialiased">
  <div id="bar" class="no-print sticky top-0 z-10 mb-6 flex items-center gap-3 bg-ink px-4 py-3 text-sm text-white">
    <img src="../assets/img/logo-ybm.png" alt="" class="h-7 bg-white p-0.5">
    <span id="title" class="flex-1 font-medium">Dokumen</span>
    <span class="hidden text-xs text-white/50 sm:inline">Gunakan "Simpan sebagai PDF" pada dialog cetak untuk arsip digital</span>
    <button onclick="window.print()" class="rounded-md bg-sky px-4 py-2 font-medium hover:bg-white hover:text-ink"><i class="fa-solid fa-print"></i> Cetak / PDF</button>
  </div>
  <div id="root"></div>

<script>
(function () {
  const E = window.PayrollEngine, H = window.HRIS;
  const { fmt, num } = E;
  const q = new URLSearchParams(location.search);
  const embed = q.has('embed');
  if (embed) { document.getElementById('bar').remove(); document.body.style.paddingTop = '16px'; }
  const root = document.getElementById('root');
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fd = (s) => s ? E.parseISO(s.slice(0, 10)).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }) : '—';
  const ft = (t) => t ? new Date(t).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  const fail = (msg) => { root.innerHTML = `<div class="page grid place-items-center text-center"><div><i class="fa-solid fa-lock text-3xl text-ink/30"></i><p class="mt-3 font-semibold">${esc(msg)}</p></div></div>`; };

  let session = null;
  try { session = JSON.parse(localStorage.getItem(H.SESSION_KEY) || 'null'); } catch (e) { /* abaikan */ }
  if (!session) { fail('Silakan masuk ke aplikasi HRIS terlebih dahulu.'); return; }
  const db = H.loadDB();
  const doc = q.get('doc') || 'slip';

  // ------------------------------------------------------------- KARTU ID BERBARCODE (ukuran CR80 85,6 × 54 mm)
  if (doc === 'kartu') {
    const empQ = q.get('emp');
    if (session.role === 'karyawan' ? empQ !== session.empId : !['admin', 'operator'].includes(session.role)) { fail('Cetak kartu hanya untuk Operator HR & Admin.'); return; }
    const list = db.employees.filter((e) => e.status === 'Aktif' && e.kartu && e.kartu.status === 'Aktif' && (!empQ || e.id === empQ));
    if (!list.length) { fail('Tidak ada kartu aktif untuk dicetak.'); return; }
    const lok = (id) => (db.lokasi.find((l) => l.id === id) || {}).nama || '';
    const ini = (n) => n.split(' ').filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
    const card = (e) => `
      <div class="idc" style="width:85.6mm;height:54mm;border-radius:3mm;overflow:hidden;border:0.3mm solid #cfd4dc;display:flex;flex-direction:column;background:#fff;break-inside:avoid">
        <div style="background:#0E3A78;color:#fff;display:flex;align-items:center;gap:2mm;padding:1.6mm 3mm">
          <img src="../assets/img/logo-ybm.png" alt="" style="height:5mm;background:#fff;padding:0.3mm">
          <div style="line-height:1.1"><div style="font-size:7pt;font-weight:700">PT. YAWIRAYA BINA MANDIRI</div><div style="font-size:5pt;opacity:.75">KARTU IDENTITAS &amp; ABSENSI KARYAWAN</div></div>
        </div>
        <div style="display:flex;gap:3mm;padding:2mm 3mm 0;flex:1">
          <div style="width:15mm;height:19mm;background:#F1F2F4;display:grid;place-items:center;font-weight:700;color:#0E3A78;font-size:11pt;flex-shrink:0">${esc(ini(e.nama))}</div>
          <div style="min-width:0;line-height:1.25">
            <div style="font-size:8.5pt;font-weight:700">${esc(e.nama)}</div>
            <div style="font-size:6.5pt;color:#555">${esc(e.jabatan)}</div>
            <div style="font-size:6pt;color:#555;margin-top:0.8mm">NIK ${esc(e.nik)} · ${esc(e.kategori)}</div>
            <div style="font-size:6pt;color:#555">${esc(lok(e.lokasiId))}</div>
          </div>
        </div>
        <div style="padding:0 3mm 1.2mm;text-align:center"><svg class="bc" data-code="${esc(e.kartu.no)}" style="display:block;margin:0 auto;height:12mm;max-width:100%"></svg></div>
        <div style="background:#F39A2B;height:1.2mm"></div>
      </div>`;
    const pages = []; for (let i = 0; i < list.length; i += 10) pages.push(list.slice(i, i + 10));
    document.getElementById('title') && (document.getElementById('title').textContent = `Kartu ID Karyawan — ${list.length} kartu`);
    document.title = 'Kartu ID Karyawan — YBM';
    root.innerHTML = pages.map((p) => `<div class="page a4"><p class="no-print mb-3 text-xs text-ink/50">Cetak pada kertas PVC/art carton, potong mengikuti garis tepi. Ukuran kartu 85,6 × 54 mm (standar kartu ATM).</p><div style="display:grid;grid-template-columns:repeat(2,85.6mm);gap:5mm 8mm;justify-content:center">${p.map(card).join('')}</div></div>`).join('');
    const draw = () => document.querySelectorAll('svg.bc').forEach((el) => JsBarcode(el, el.dataset.code, { format: 'CODE128', height: 40, width: 1.6, fontSize: 12, margin: 0, font: 'monospace' }));
    if (window.JsBarcode) draw(); else document.getElementById('jsb').addEventListener('load', draw);
    return;
  }

  const run = db.runs.find((r) => r.id === q.get('run'));
  if (!run) { fail('Data payroll tidak ditemukan.'); return; }
  const role = session.role;
  const approvedEntry = [...run.history].reverse().find((h) => h.status === 'Disetujui');
  const paidEntry = [...run.history].reverse().find((h) => h.status === 'Dibayar');
  const draft = !['Disetujui', 'Dibayar'].includes(run.status);
  const P = db.perusahaan;

  // hak akses dokumen
  if (role === 'karyawan') {
    if (doc !== 'slip' || q.get('emp') !== session.empId) { fail('Anda hanya dapat melihat slip gaji milik sendiri.'); return; }
    if (draft) { fail('Slip gaji belum tersedia — payroll belum disetujui.'); return; }
  } else if (role === 'operator' && doc !== 'absensi') { fail('Dokumen ini hanya untuk Keuangan, Pimpinan & Admin.'); return; }

  const header = (judul, sub) => `
    <div class="flex items-start justify-between gap-6 border-b-2 border-ink pb-3">
      <div class="flex items-center gap-3">
        <img src="../assets/img/logo-ybm.png" alt="" class="h-12">
        <div class="leading-tight"><p class="text-[15px] font-bold text-navy">${esc(P.nama)}</p><p class="text-[10px] text-ink/60">${esc(P.alamat)}</p><p class="text-[10px] text-ink/60">Telp. ${esc(P.telp)} · ${esc(P.email)}</p></div>
      </div>
      <div class="text-right leading-tight"><p class="text-lg font-bold uppercase tracking-wide">${judul}</p>${sub}</div>
    </div>`;
  const foot = (code) => `<p class="mt-4 flex justify-between border-t border-ink/10 pt-2 text-[9px] text-ink/40"><span>Dokumen dibuat oleh sistem HRIS YBM · ${ft(new Date().toISOString())} · <b>PROTOTYPE — DATA DUMMY</b></span><span>Kode verifikasi: <b class="font-mono text-ink/70">${code}</b></span></p>`;
  const wm = draft ? `<div class="watermark">DRAFT · ${esc(run.status.toUpperCase())}</div>` : '';
  const periode = `${E.periodLabel(run.period)}`;
  const rentang = `${fd(run.from)} – ${fd(run.to)}`;

  // ------------------------------------------------------------- SLIP GAJI
  function slip(l) {
    const code = E.docCode(run.id, l.empId, l.thp);
    const no = `YBM/PAY/${run.period.replace('-', '')}/${l.nik.replace('YBM-', '')}`;
    const rows = (arr) => arr.map((p) => `<tr><td>${esc(p.nama)}<span class="block text-[9px] text-ink/50">${esc(p.ket || '')}</span></td><td class="num">${fmt(p.nilai)}</td></tr>`).join('');
    const h = l.hadir;
    const att = [['Hari jadwal', h.jadwal], ['Hadir', h.hadir], ['Terlambat', h.terlambat ? `${h.terlambat}× (${h.menitTerlambat} mnt)` : 0], ['Alpa', h.alpa], ['Izin', h.izin], ['Sakit', h.sakit], ['Cuti', h.cuti], ['Lembur', num(l.jamLembur) + ' jam']];
    return `<div class="page">${wm}
      ${header('Slip Gaji', `<p class="text-xs">Periode <b>${periode}</b></p><p class="text-[10px] text-ink/60">Absensi ${rentang}</p><p class="font-mono text-[10px] text-ink/60">No. ${no}</p>`)}
      <table class="mt-3 w-full text-[11px]"><tr>
        <td class="w-1/2 align-top"><table>
          <tr><td class="w-28 py-0.5 text-ink/60">Nama</td><td class="font-semibold">: ${esc(l.nama)}</td></tr>
          <tr><td class="py-0.5 text-ink/60">NIK</td><td>: ${esc(l.nik)}</td></tr>
          <tr><td class="py-0.5 text-ink/60">Jabatan</td><td>: ${esc(l.jabatan)}</td></tr>
          <tr><td class="py-0.5 text-ink/60">Unit / kategori</td><td>: ${esc(l.unit)} · ${esc(l.kategori)}</td></tr>
        </table></td>
        <td class="w-1/2 align-top"><table>
          <tr><td class="w-28 py-0.5 text-ink/60">Lokasi kerja</td><td>: ${esc(l.lokasi)}</td></tr>
          <tr><td class="py-0.5 text-ink/60">Skema kerja</td><td>: ${esc(l.jadwal)}</td></tr>
          <tr><td class="py-0.5 text-ink/60">Status / PTKP</td><td>: ${esc(l.statusKerja)} · ${esc(l.ptkp)}</td></tr>
          <tr><td class="py-0.5 text-ink/60">NPWP</td><td>: ${esc(l.npwp || '(menggunakan NIK KTP)')}</td></tr>
        </table></td></tr></table>
      <div class="mt-3 grid grid-cols-8 divide-x divide-ink/10 bg-surface text-center">${att.map(([k, v]) => `<div class="px-1 py-1.5"><p class="text-[8px] uppercase tracking-wider text-ink/50">${k}</p><p class="text-[12px] font-semibold">${v}</p></div>`).join('')}</div>
      <div class="mt-3 grid grid-cols-2 gap-6">
        <div><p class="mb-1 text-[10px] font-bold uppercase tracking-widest text-emerald-700">Pendapatan</p><table class="tbl"><tbody>${rows(l.pendapatan)}</tbody><tfoot><tr class="border-t-[1.5px] border-ink font-bold"><td class="py-1.5 text-[11px]">Total Pendapatan</td><td class="num py-1.5 text-[11px]">${fmt(l.totalPendapatan)}</td></tr></tfoot></table></div>
        <div><p class="mb-1 text-[10px] font-bold uppercase tracking-widest text-red-700">Potongan</p><table class="tbl"><tbody>${rows(l.potongan)}</tbody><tfoot><tr class="border-t-[1.5px] border-ink font-bold"><td class="py-1.5 text-[11px]">Total Potongan</td><td class="num py-1.5 text-[11px]">${fmt(l.totalPotongan)}</td></tr></tfoot></table></div>
      </div>
      <div class="mt-3 flex items-center justify-between bg-ink px-4 py-3 text-white"><div><p class="text-[10px] uppercase tracking-widest text-white/60">Gaji bersih diterima (take home pay)</p><p class="text-[10px] italic text-white/70">${E.terbilang(l.thp)}</p></div><p class="text-2xl font-semibold tabular-nums">${fmt(l.thp)}</p></div>
      <p class="mt-1.5 text-[10px] text-ink/60">Ditransfer ke <b>${esc(l.bank)} ${esc(l.rekening)}</b> a.n. ${esc(l.atasNama)}${paidEntry ? ` pada ${fd(run.paidAt)}` : ' (menunggu pembayaran)'}</p>
      ${l.lembur.length ? `<div class="mt-3"><p class="mb-1 text-[10px] font-bold uppercase tracking-widest text-ink/50">Rincian lembur · upah/jam ${fmt(l.upahJam)} = (${l.dasarLembur === 'pokok' ? 'gaji pokok' : 'gaji pokok + tunjangan tetap'} ${fmt(l.dasarLembur === 'pokok' ? l.upahBulanan : l.upahTetap)}) ÷ ${run.rulesSnapshot ? run.rulesSnapshot.lembur.pembagi : 173}</p>
        <table class="tbl"><thead><tr><th>Tanggal</th><th>Jenis hari</th><th>Scan</th><th class="num">Jam</th><th>Pengali</th><th class="num">Ekuivalen</th><th class="num">Nilai</th></tr></thead><tbody>
        ${l.lembur.map((o) => `<tr><td>${E.parseISO(o.ds).toLocaleDateString('id-ID', { weekday: 'short', day: 'numeric', month: 'short' })}</td><td>${o.jenis}</td><td class="font-mono">${o.masuk}–${o.pulang}</td><td class="num">${num(o.jam)}</td><td>${o.rincian.map((x) => `${num(x.jam)}×${num(x.kali)}`).join(' + ')}</td><td class="num">${num(o.ekuivalen)}</td><td class="num">${fmt(o.nilai)}</td></tr>`).join('')}
        </tbody></table></div>` : ''}
      <div class="mt-3 grid grid-cols-2 gap-6 text-[10px] text-ink/70">
        <div><p class="mb-1 font-bold uppercase tracking-widest text-ink/50">Ditanggung perusahaan (tidak memotong gaji)</p>${l.perusahaan.map((p) => `<p class="flex justify-between"><span>${esc(p.nama)} ${esc(p.ket)}</span><span class="tabular-nums">${fmt(p.nilai)}</span></p>`).join('')}</div>
        <div><p class="mb-1 font-bold uppercase tracking-widest text-ink/50">Dasar PPh 21</p><p class="flex justify-between"><span>Penghasilan bruto (termasuk premi JKK, JKM, BPJS Kes)</span><span class="tabular-nums">${fmt(l.pph.bruto)}</span></p><p class="flex justify-between"><span>Tarif TER kategori ${l.pph.kategori}</span><span>${num(l.pph.tarif, 2)}%</span></p><p class="flex justify-between"><span>PPh 21 ${l.pph.metode === 'ditanggung' ? '(ditanggung perusahaan)' : 'dipotong'}</span><span class="tabular-nums">${fmt(l.pph.nilai)}</span></p></div>
      </div>
      <div class="mt-5 grid grid-cols-2 gap-6 text-center text-[10px]">
        <div><p class="text-ink/60">Disetujui oleh</p>${approvedEntry ? `<p class="mt-2 inline-block rotate-[-4deg] rounded border-2 border-emerald-600 px-3 py-1 text-[10px] font-bold uppercase text-emerald-700">✓ Disetujui elektronik<br><span class="font-normal normal-case">${ft(approvedEntry.at)}</span></p>` : '<div class="h-12"></div>'}<p class="mt-1 font-semibold">${approvedEntry ? esc(approvedEntry.oleh) : '(belum disetujui)'}</p><p class="text-ink/50">${approvedEntry ? esc((H.ROLES[approvedEntry.role] || {}).nama || 'Pimpinan') : 'Pimpinan'}</p></div>
        <div><p class="text-ink/60">Diterima oleh</p><div class="h-12"></div><p class="mt-1 font-semibold">${esc(l.nama)}</p><p class="text-ink/50">Karyawan</p></div>
      </div>
      <p class="mt-3 text-[9px] text-ink/50">Slip ini bersifat rahasia. Keberatan atas perhitungan dapat disampaikan ke bagian Keuangan paling lambat 7 hari setelah slip diterima.</p>
      ${foot(code)}
    </div>`;
  }

  // ------------------------------------------------------------- KARTU ABSENSI
  function kartu(empId) {
    const emp = db.employees.find((e) => e.id === empId);
    if (!emp) return '';
    const ctx = E.buildContext(db);
    const s = E.attendanceSummary(emp, run.from, run.to, ctx);
    const j = db.jadwal.find((x) => x.id === emp.jadwalId) || {};
    const code = E.docCode('ABS', run.period, emp.id, s.hadir);
    return `<div class="page a4">
      ${header('Kartu Absensi', `<p class="text-xs">Periode <b>${periode}</b></p><p class="text-[10px] text-ink/60">${rentang}</p>`)}
      <div class="mt-3 grid grid-cols-2 gap-x-8 text-[11px]">
        <p><span class="inline-block w-24 text-ink/60">Nama</span>: <b>${esc(emp.nama)}</b></p><p><span class="inline-block w-24 text-ink/60">Skema kerja</span>: ${esc(j.kode)} — ${esc(j.nama)}</p>
        <p><span class="inline-block w-24 text-ink/60">NIK / PIN</span>: ${esc(emp.nik)} / ${esc(emp.pin)}</p><p><span class="inline-block w-24 text-ink/60">Jam kerja</span>: ${j.masuk}–${j.pulang} (${num(j.jamReguler)} jam, istirahat ${j.istirahat} mnt)</p>
        <p><span class="inline-block w-24 text-ink/60">Jabatan</span>: ${esc(emp.jabatan)}</p><p><span class="inline-block w-24 text-ink/60">Lokasi</span>: ${esc((db.lokasi.find((x) => x.id === emp.lokasiId) || {}).nama)}</p>
      </div>
      <table class="tbl mt-3"><thead><tr><th>Tanggal</th><th>Jenis hari</th><th>Masuk</th><th>Pulang</th><th class="num">Terlambat</th><th class="num">Jam kerja</th><th class="num">Lembur</th><th>Status lembur</th><th>Keterangan</th></tr></thead><tbody>
      ${s.days.map((d) => `<tr style="${!d.sched ? 'background:#f6f7f8' : ''}"><td>${E.parseISO(d.ds).toLocaleDateString('id-ID', { weekday: 'short', day: '2-digit', month: 'short' })}</td><td>${esc(d.hol || d.jenisHari)}</td><td class="font-mono">${d.masuk || '—'}</td><td class="font-mono">${d.pulang || '—'}</td><td class="num">${d.late ? d.late + "'" : ''}</td><td class="num">${d.kerja ? num(d.kerja / 60) : ''}</td><td class="num">${d.ot ? num(d.ot) : ''}</td><td>${d.otStatus || ''}</td><td><b>${esc(d.status)}</b></td></tr>`).join('')}
      </tbody></table>
      <div class="mt-3 grid grid-cols-9 divide-x divide-ink/10 bg-surface text-center">${[['Jadwal', s.jadwal], ['Hadir', s.hadir], ['Terlambat', s.terlambat], ['Tdk lengkap', s.tidakLengkap], ['Alpa', s.alpa], ['Izin', s.izin], ['Sakit', s.sakit], ['Cuti', s.cuti], ['Lembur (j)', num(s.lembur.reduce((a, r) => a + r.otJam, 0))]].map(([k, v]) => `<div class="py-1.5"><p class="text-[8px] uppercase text-ink/50">${k}</p><p class="text-sm font-semibold">${v}</p></div>`).join('')}</div>
      <div class="mt-8 grid grid-cols-3 gap-6 text-center text-[10px]">${['Karyawan', 'Operator HR / Absensi', 'Atasan Langsung'].map((r, i) => `<div><p class="text-ink/60">${i === 0 ? 'Diperiksa oleh' : i === 1 ? 'Diverifikasi oleh' : 'Mengetahui'}</p><div class="h-14"></div><p class="border-t border-ink/30 pt-1 font-semibold">${i === 0 ? esc(emp.nama) : '(....................)'}</p><p class="text-ink/50">${r}</p></div>`).join('')}</div>
      ${foot(code)}
    </div>`;
  }

  // ------------------------------------------------------------- LEMBAR PENGESAHAN
  function pengesahan() {
    const t = run.totals;
    const by = (f) => { const m = {}; run.lines.forEach((l) => { const k = f(l); m[k] = m[k] || { n: 0, pend: 0, pot: 0, thp: 0, biaya: 0, lembur: 0 }; const g = m[k]; g.n++; g.pend += l.totalPendapatan; g.pot += l.totalPotongan; g.thp += l.thp; g.biaya += l.biaya; g.lembur += l.nilaiLembur; }); return Object.entries(m); };
    const sum = (grp, kode) => run.lines.reduce((a, l) => a + l[grp].filter((x) => x.kode === kode).reduce((b, x) => b + x.nilai, 0), 0);
    const komp = [['Gaji pokok', sum('pendapatan', 'GP')], ['Tunjangan jabatan', sum('pendapatan', 'TJ')], ['Tunjangan lokasi', sum('pendapatan', 'TL')], ['Tunjangan makan', sum('pendapatan', 'TM')], ['Tunjangan transport', sum('pendapatan', 'TT')], ['Upah lembur', sum('pendapatan', 'LB')], ['Penyesuaian (+)', sum('pendapatan', 'ADJ')]];
    const pot = [['BPJS Kesehatan (pekerja)', sum('potongan', 'BK')], ['BPJS JHT (pekerja)', sum('potongan', 'JHT')], ['BPJS JP (pekerja)', sum('potongan', 'JP')], ['PPh 21', sum('potongan', 'PPH')], ['Potongan alpa', sum('potongan', 'PA')], ['Penyesuaian (−)', sum('potongan', 'ADJ')]];
    const sign = (label, role, h) => `<div><p class="text-ink/60">${label}</p>${h ? `<p class="mt-2 inline-block rotate-[-3deg] rounded border-2 border-emerald-600 px-2 py-0.5 text-[9px] font-bold uppercase text-emerald-700">✓ ${esc(h.status)} · ${ft(h.at)}</p>` : '<div class="h-8"></div>'}<p class="mt-2 border-t border-ink/30 pt-1 font-semibold">${h ? esc(h.oleh) : '(....................)'}</p><p class="text-ink/50">${role}</p></div>`;
    const submitted = [...run.history].reverse().find((h) => h.status === 'Diajukan');
    return `<div class="page a4">${wm}
      ${header('Lembar Pengesahan Payroll', `<p class="text-xs">Periode <b>${periode}</b></p><p class="text-[10px] text-ink/60">Absensi ${rentang}</p><p class="text-[10px]">Status: <b>${esc(run.status)}</b></p>`)}
      <div class="mt-4 grid grid-cols-4 gap-3">${[['Jumlah karyawan', t.karyawan + ' orang'], ['Total take home pay', fmt(t.thp)], ['Beban BPJS perusahaan', fmt(t.perusahaan)], ['Total biaya tenaga kerja', fmt(t.biaya)]].map(([k, v]) => `<div class="bg-surface p-3"><p class="text-[9px] uppercase tracking-wider text-ink/50">${k}</p><p class="mt-1 text-sm font-bold tabular-nums">${v}</p></div>`).join('')}</div>
      <div class="mt-4 grid grid-cols-2 gap-6">
        <table class="tbl"><thead><tr><th>Komponen pendapatan</th><th class="num">Jumlah</th></tr></thead><tbody>${komp.map(([k, v]) => `<tr><td>${k}</td><td class="num">${fmt(v)}</td></tr>`).join('')}</tbody><tfoot><tr class="font-bold"><td class="py-1.5">Total pendapatan</td><td class="num">${fmt(t.pendapatan)}</td></tr></tfoot></table>
        <table class="tbl"><thead><tr><th>Komponen potongan</th><th class="num">Jumlah</th></tr></thead><tbody>${pot.map(([k, v]) => `<tr><td>${k}</td><td class="num">${fmt(v)}</td></tr>`).join('')}</tbody><tfoot><tr class="font-bold"><td class="py-1.5">Total potongan</td><td class="num">${fmt(t.potongan)}</td></tr></tfoot></table>
      </div>
      <p class="mb-1 mt-5 text-[10px] font-bold uppercase tracking-widest text-ink/50">Rekap per kategori & unit kerja</p>
      <table class="tbl"><thead><tr><th>Kelompok</th><th class="num">Orang</th><th class="num">Pendapatan</th><th class="num">Lembur</th><th class="num">Potongan</th><th class="num">THP</th><th class="num">Biaya total</th></tr></thead><tbody>
        ${[...by((l) => 'Kategori: ' + l.kategori), ...by((l) => 'Unit: ' + l.unit)].map(([k, g]) => `<tr><td>${esc(k)}</td><td class="num">${g.n}</td><td class="num">${fmt(g.pend)}</td><td class="num">${fmt(g.lembur)}</td><td class="num">${fmt(g.pot)}</td><td class="num">${fmt(g.thp)}</td><td class="num">${fmt(g.biaya)}</td></tr>`).join('')}
      </tbody></table>
      <p class="mb-1 mt-5 text-[10px] font-bold uppercase tracking-widest text-ink/50">Jejak proses</p>
      <table class="tbl"><thead><tr><th>Waktu</th><th>Status</th><th>Oleh</th><th>Catatan</th></tr></thead><tbody>${run.history.map((h) => `<tr><td>${ft(h.at)}</td><td><b>${esc(h.status)}</b></td><td>${esc(h.oleh)} (${esc((H.ROLES[h.role] || {}).nama || h.role)})</td><td>${esc(h.catatan || '')}</td></tr>`).join('')}</tbody></table>
      <div class="mt-10 grid grid-cols-3 gap-6 text-center text-[10px]">${sign('Dibuat oleh', 'Keuangan / Payroll', submitted)}${sign('Disetujui oleh', 'Pimpinan / Direksi', approvedEntry)}${sign('Dibayarkan oleh', 'Keuangan', paidEntry)}</div>
      ${foot(E.docCode('SAH', run.id, t.thp))}
    </div>`;
  }

  // ------------------------------------------------------------- DAFTAR TRANSFER
  function transfer() {
    const banks = {}; run.lines.forEach((l) => { banks[l.bank] = (banks[l.bank] || 0) + l.thp; });
    return `<div class="page a4">${wm}
      ${header('Daftar Transfer Gaji', `<p class="text-xs">Periode <b>${periode}</b></p><p class="font-mono text-[10px] text-ink/60">Batch GAJI-${run.period.replace('-', '')}</p>`)}
      <table class="tbl mt-4"><thead><tr><th>No</th><th>Bank</th><th>No. rekening</th><th>Atas nama</th><th>NIK</th><th class="num">Nominal</th><th>Berita</th></tr></thead><tbody>
        ${run.lines.map((l, i) => `<tr><td>${i + 1}</td><td>${esc(l.bank)}</td><td class="font-mono">${esc(l.rekening)}</td><td>${esc(l.atasNama)}</td><td>${esc(l.nik)}</td><td class="num">${fmt(l.thp)}</td><td class="font-mono text-[10px]">GAJI ${run.period}</td></tr>`).join('')}
      </tbody><tfoot><tr class="font-bold"><td colspan="5" class="py-2">Total (${run.lines.length} rekening)</td><td class="num">${fmt(run.totals.thp)}</td><td></td></tr></tfoot></table>
      <div class="mt-4 w-1/2"><p class="mb-1 text-[10px] font-bold uppercase tracking-widest text-ink/50">Rekap per bank</p><table class="tbl"><tbody>${Object.entries(banks).map(([b, v]) => `<tr><td>${esc(b)}</td><td class="num">${fmt(v)}</td></tr>`).join('')}</tbody></table></div>
      <p class="mt-3 text-[10px] italic text-ink/60">Terbilang: ${E.terbilang(run.totals.thp)}</p>
      <div class="mt-10 grid grid-cols-2 gap-6 text-center text-[10px]"><div><p class="text-ink/60">Disiapkan oleh</p><div class="h-14"></div><p class="border-t border-ink/30 pt-1 font-semibold">Keuangan / Payroll</p></div><div><p class="text-ink/60">Disetujui oleh</p><div class="h-14"></div><p class="border-t border-ink/30 pt-1 font-semibold">${approvedEntry ? esc(approvedEntry.oleh) : '(....................)'}</p><p class="text-ink/50">Pimpinan</p></div></div>
      ${foot(E.docCode('TRF', run.id, run.totals.thp))}
    </div>`;
  }

  const title = { slip: 'Slip Gaji', absensi: 'Kartu Absensi', pengesahan: 'Lembar Pengesahan Payroll', transfer: 'Daftar Transfer Gaji' }[doc] || 'Dokumen';
  const tEl = document.getElementById('title'); if (tEl) tEl.textContent = `${title} — ${periode}`;
  document.title = `${title} ${periode} — YBM`;
  const emp = q.get('emp');
  if (doc === 'slip') {
    const lines = emp ? run.lines.filter((l) => l.empId === emp) : run.lines;
    if (!lines.length) { fail('Slip tidak ditemukan untuk karyawan ini.'); return; }
    root.innerHTML = lines.map(slip).join('');
  } else if (doc === 'absensi') {
    root.innerHTML = (emp ? [emp] : run.lines.map((l) => l.empId)).map(kartu).join('');
  } else if (doc === 'pengesahan') root.innerHTML = pengesahan();
  else if (doc === 'transfer') root.innerHTML = transfer();
  if (q.has('print')) setTimeout(() => window.print(), 600);
})();
</script>
</body>
</html>
