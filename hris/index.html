          <tbody class="divide-y divide-black/5">
            <tr class="bg-surface/60"><td class="px-4 py-2 text-[11px] font-semibold uppercase tracking-wider text-ink/40" colspan="6">Menu</td></tr>
            <template x-for="(r, k) in routes" :key="k"><tr><td class="td"><i class="fa-solid w-5 text-ink/40" :class="r[1]"></i> <span x-text="r[0]"></span></td><template x-for="(ro, rk) in roles" :key="rk"><td class="td text-center"><i class="fa-solid" :class="r[2].includes(rk) ? 'fa-circle-check text-emerald-600' : 'fa-minus text-ink/15'"></i></td></template></tr></template>
            <tr class="bg-surface/60"><td class="px-4 py-2 text-[11px] font-semibold uppercase tracking-wider text-ink/40" colspan="6">Tindakan</td></tr>
            <template x-for="(p, k) in perms" :key="k"><tr><td class="td" x-text="p[0]"></td><template x-for="(ro, rk) in roles" :key="rk"><td class="td text-center"><i class="fa-solid" :class="p[1].includes(rk) ? 'fa-circle-check text-emerald-600' : 'fa-minus text-ink/15'"></i></td></template></tr></template>
          </tbody>
        </table>
      </div>
    </section>

    <!-- ============================================================ SKEMA -->
    <section x-show="route === 'skema'" class="space-y-5">
      <div><h1 class="display text-4xl">Skema Database</h1><p class="mt-2 max-w-3xl text-sm text-ink/60">Konsep struktur tabel untuk analisa dan penyusunan sistem produksi (MySQL/PostgreSQL). Prototype ini menyimpan data yang sama di browser. Dokumen lengkap: <code>hris/KONSEP-DATABASE.md</code>.</p></div>
      <div class="card p-5 text-sm">
        <p class="font-semibold">Alur data utama</p>
        <div class="mt-3 flex flex-wrap items-center gap-2 text-xs">
          <template x-for="(s, i) in ['Scanner kartu barcode', 'log_absensi', 'absensi_harian', 'persetujuan_lembur + pengajuan_izin', 'payroll_periode', 'payroll_detail + komponen', 'Slip gaji / laporan']"><span class="inline-flex items-center gap-2"><span class="bg-ink px-3 py-1.5 font-mono text-white" x-text="s"></span><i x-show="i < 6" class="fa-solid fa-arrow-right text-ink/30"></i></span></template>
        </div>
      </div>
      <template x-for="grp in ['Master', 'Absensi', 'Payroll', 'Sistem']">
        <div>
          <h2 class="mb-3 text-xs font-semibold uppercase tracking-widest text-ink/40" x-text="grp"></h2>
          <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
            <template x-for="t in schema.filter(t => t[0] === grp)" :key="t[1]">
              <div class="card overflow-hidden"><div class="bg-ink px-4 py-3 text-white"><p class="font-mono text-sm" x-text="t[1]"></p><p class="text-[11px] text-white/50" x-text="t[2]"></p></div><ul class="divide-y divide-black/5 text-xs"><template x-for="f in t[3]"><li class="flex gap-2 px-4 py-1.5"><span class="font-mono" :class="f.includes(':PK') ? 'font-semibold text-accent' : f.includes(':FK') ? 'text-navy' : ''" x-text="f.split(':')[0]"></span><span class="ml-auto text-right text-ink/50" x-text="f.split(':').slice(1).join(':')"></span></li></template></ul></div>
            </template>
          </div>
        </div>
      </template>
    </section>

    <!-- ============================================================ AUDIT -->
    <section x-show="route === 'audit'" class="space-y-5">
      <div><h1 class="display text-4xl">Log Aktivitas</h1><p class="mt-2 text-sm text-ink/60">Jejak seluruh perubahan data oleh pengguna dan sistem.</p></div>
      <div class="card divide-y divide-black/5">
        <template x-for="(a, i) in db.activity" :key="i"><div class="flex items-start gap-4 px-5 py-3 text-sm"><span class="w-36 shrink-0 text-xs tabular-nums text-ink/50" x-text="fmtTime(a.t)"></span><span class="flex-1" x-text="a.msg"></span><span class="text-right text-xs"><span class="block font-medium" x-text="a.user"></span><span class="text-ink/40" x-text="roleName(a.role)"></span></span></div></template>
        <p x-show="!db.activity.length" class="p-6 text-sm text-ink/50">Belum ada aktivitas.</p>
      </div>
    </section>

  </main>
</div>

<!-- =============================================================== MODAL: FORM KARYAWAN -->
<template x-if="empModal">
  <div class="modal-wrap" @keydown.escape.window="empModal = false">
    <div class="modal max-w-3xl" x-trap.noscroll="empModal" @click.outside="empModal = false">
      <div class="flex items-center justify-between border-b border-black/5 px-6 py-4"><h2 class="font-semibold" x-text="empForm.id ? 'Ubah data karyawan' : 'Tambah karyawan'"></h2><button @click="empModal = false" class="btn-icon"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="flex gap-6 overflow-x-auto border-b border-black/5 px-6 pt-4">
        <template x-for="t in [['pribadi','Data pribadi'],['pekerjaan','Pekerjaan & jadwal'],['gaji','Gaji & rekening'],['fp','Kartu absensi']]"><button @click="empTab = t[0]" class="tab" :class="empTab === t[0] && 'is-active'" x-text="t[1]"></button></template>
      </div>
      <form @submit.prevent="saveEmp()" class="p-6">
        <fieldset :disabled="!can('emp.edit')" x-show="empTab === 'pribadi'" class="grid gap-4 sm:grid-cols-2">
          <label class="sm:col-span-2"><span class="label">Nama lengkap *</span><input x-model="empForm.nama" class="input" required></label>
          <label><span class="label">NIK karyawan *</span><input x-model="empForm.nik" class="input"></label>
          <label><span class="label">Jenis kelamin</span><select x-model="empForm.jk" class="input"><option value="L">Laki-laki</option><option value="P">Perempuan</option></select></label>
          <label><span class="label">No. KTP</span><input x-model="empForm.ktp" class="input"></label>
          <label><span class="label">Telepon</span><input x-model="empForm.telp" class="input"></label>
          <label class="sm:col-span-2"><span class="label">Email</span><input x-model="empForm.email" type="email" class="input"></label>
        </fieldset>
        <fieldset :disabled="!can('emp.edit')" x-show="empTab === 'pekerjaan'" class="grid gap-4 sm:grid-cols-2">
          <label><span class="label">Kategori</span><select x-model="empForm.kategori" class="input"><option>Lapangan</option><option>Kantor</option></select></label>
          <label><span class="label">Unit kerja</span><select x-model="empForm.unitId" class="input"><template x-for="u in db.units"><option :value="u.id" x-text="u.nama" :selected="u.id === empForm.unitId"></option></template></select></label>
          <label><span class="label">Jabatan</span><input x-model="empForm.jabatan" class="input"></label>
          <label><span class="label">Lokasi kerja</span><select x-model="empForm.lokasiId" class="input"><template x-for="l in db.lokasi"><option :value="l.id" x-text="l.nama" :selected="l.id === empForm.lokasiId"></option></template></select></label>
          <label><span class="label">Skema / jadwal kerja</span><select x-model="empForm.jadwalId" class="input"><template x-for="j in db.jadwal"><option :value="j.id" x-text="j.kode + ' — ' + j.nama" :selected="j.id === empForm.jadwalId"></option></template></select></label>
          <label x-show="jadwalById(empForm.jadwalId).pola === 'siklus'"><span class="label">Grup roster (hari libur bergulir)</span><select x-model.number="empForm.rosterOffset" class="input"><template x-for="g in [0,1,2,3,4,5,6]"><option :value="g" x-text="'Grup ' + String.fromCharCode(65 + g)" :selected="g === Number(empForm.rosterOffset)"></option></template></select></label>
          <label><span class="label">Status kerja</span><select x-model="empForm.statusKerja" class="input"><option>PKWTT</option><option>PKWT</option><option>Harian Lepas</option></select></label>
          <label><span class="label">Tanggal masuk</span><input type="date" x-model="empForm.tglMasuk" class="input"></label>
          <label><span class="label">Status</span><select x-model="empForm.status" class="input"><option>Aktif</option><option>Nonaktif</option></select></label>
        </fieldset>
        <div x-show="empTab === 'gaji'">
          <p x-show="!can('emp.gaji.view')" class="bg-surface p-4 text-sm text-ink/60"><i class="fa-solid fa-lock"></i> Data gaji hanya dapat dilihat Keuangan, Pimpinan &amp; Admin.</p>
          <fieldset x-show="can('emp.gaji.view')" :disabled="!can('emp.gaji')" class="grid gap-4 sm:grid-cols-2">
            <p x-show="!can('emp.gaji')" class="text-xs text-amber-700 sm:col-span-2"><i class="fa-solid fa-lock"></i> Hanya Keuangan / Admin yang dapat mengubah komponen gaji.</p>
            <label><span class="label">Tipe gaji</span><select x-model="empForm.tipeGaji" class="input"><option>Bulanan</option><option>Harian</option></select></label>
            <label x-show="empForm.tipeGaji === 'Bulanan'"><span class="label">Gaji pokok / bulan</span><input type="number" x-model="empForm.gaji.pokok" class="input"></label>
            <label x-show="empForm.tipeGaji === 'Harian'"><span class="label">Upah harian</span><input type="number" x-model="empForm.gaji.upahHarian" class="input"></label>
            <label><span class="label">Tunjangan jabatan / bulan</span><input type="number" x-model="empForm.gaji.tunjJabatan" class="input"></label>
            <label><span class="label">Tunjangan lokasi (dari master lokasi)</span><input :value="fmt(lokById(empForm.lokasiId).tunjangan)" disabled class="input"></label>
            <label><span class="label">Tunjangan makan / hari hadir</span><input type="number" x-model="empForm.gaji.makan" class="input"></label>
            <label><span class="label">Tunjangan transport / hari hadir</span><input type="number" x-model="empForm.gaji.transport" class="input"></label>
            <label><span class="label">Status PTKP</span><select x-model="empForm.ptkp" class="input"><template x-for="p in ['TK/0','TK/1','TK/2','TK/3','K/0','K/1','K/2','K/3']"><option x-text="p" :selected="p === empForm.ptkp"></option></template></select></label>
            <label><span class="label">NPWP</span><input x-model="empForm.npwp" class="input" placeholder="Kosong = pakai NIK KTP"></label>
            <div class="flex flex-wrap gap-4 sm:col-span-2"><label class="flex items-center gap-2 text-sm"><input type="checkbox" x-model="empForm.bpjs.kes"> BPJS Kesehatan</label><label class="flex items-center gap-2 text-sm"><input type="checkbox" x-model="empForm.bpjs.tk"> BPJS TK (JHT, JKK, JKM)</label><label class="flex items-center gap-2 text-sm"><input type="checkbox" x-model="empForm.bpjs.jp"> Jaminan Pensiun</label></div>
            <label><span class="label">Bank</span><input x-model="empForm.bank" class="input"></label>
            <label><span class="label">No. rekening</span><input x-model="empForm.rekening" class="input"></label>
            <label class="sm:col-span-2"><span class="label">Atas nama rekening</span><input x-model="empForm.atasNama" class="input"></label>
          </fieldset>
        </div>
        <fieldset :disabled="!can('emp.edit')" x-show="empTab === 'fp'" class="grid gap-4 sm:grid-cols-2">
          <label><span class="label">ID absensi *</span><input x-model="empForm.pin" :disabled="!!empForm.id" class="input font-mono"></label>
          <div class="text-sm"><span class="label">Kartu ID</span><p><span class="font-mono" x-text="empForm.kartu.no || '(diterbitkan otomatis saat disimpan)'"></span> <span class="badge ml-1" :class="cardCls[empForm.kartu.status]" x-show="empForm.kartu.no" x-text="empForm.kartu.status"></span></p></div>
          <p class="text-xs text-ink/50 sm:col-span-2">Nomor kartu (isi barcode) dibentuk dari ID absensi + versi kartu. Penggantian & pemblokiran kartu dilakukan di menu Kartu &amp; Scanner Barcode.</p>
        </fieldset>
        <div class="mt-6 flex justify-end gap-2 border-t border-black/5 pt-5"><button type="button" @click="empModal = false" class="btn-light">Batal</button><button class="btn-primary"><i class="fa-solid fa-floppy-disk"></i> Simpan</button></div>
      </form>
    </div>
  </div>
</template>

<!-- =============================================================== DRAWER: DETAIL KARYAWAN -->
<template x-if="detail">
  <div class="fixed inset-0 z-[55] flex justify-end bg-ink/50" @click.self="detail = null" @keydown.escape.window="detail = null">
    <div class="flex h-full w-full max-w-2xl flex-col bg-white shadow-2xl" x-trap.noscroll="detail">
      <div class="flex items-start gap-4 border-b border-black/5 p-6">
        <span class="grid h-14 w-14 shrink-0 place-items-center bg-navy text-lg font-semibold text-white" x-text="initials(detail.nama)"></span>
        <div class="min-w-0 flex-1"><h2 class="text-xl font-semibold" x-text="detail.nama"></h2><p class="text-sm text-ink/60" x-text="detail.nik + ' · ' + detail.jabatan"></p><p class="mt-1 text-xs text-ink/50" x-text="detail.kategori + ' · ' + unitById(detail.unitId).nama + ' · ' + lokById(detail.lokasiId).nama"></p></div>
        <button @click="detail = null" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="flex gap-6 overflow-x-auto border-b border-black/5 px-6 pt-4">
        <template x-for="t in [['profil','Profil'],['absensi','Kehadiran periode'],['slip','Riwayat gaji']]"><button x-show="t[0] !== 'slip' || can('emp.gaji.view')" @click="detailTab = t[0]" class="tab" :class="detailTab === t[0] && 'is-active'" x-text="t[1]"></button></template>
      </div>
      <div class="flex-1 overflow-y-auto p-6">
        <div x-show="detailTab === 'profil'" class="grid gap-x-6 gap-y-4 text-sm sm:grid-cols-2">
          <template x-for="f in [['Status', detail.status + ' · ' + detail.statusKerja], ['Tanggal masuk', fmtDate(detail.tglMasuk)], ['Skema kerja', jadwalById(detail.jadwalId).nama], ['Jam kerja', jadwalById(detail.jadwalId).masuk + '–' + jadwalById(detail.jadwalId).pulang + ' (' + jadwalById(detail.jadwalId).jamReguler + ' jam)'], ['ID absensi', detail.pin], ['Kartu ID', (detail.kartu.no || '—') + ' · ' + detail.kartu.status], ['No. KTP', detail.ktp], ['Telepon', detail.telp], ['Email', detail.email], ['Status PTKP', detail.ptkp]]">
            <div><p class="text-xs text-ink/50" x-text="f[0]"></p><p class="mt-0.5 font-medium" x-text="f[1]"></p></div>
          </template>
          <template x-if="can('emp.gaji.view')">
            <div class="bg-surface p-4 sm:col-span-2">
              <p class="text-xs font-semibold uppercase tracking-widest text-ink/40">Komponen gaji</p>
              <dl class="mt-3 grid grid-cols-2 gap-3">
                <div><dt class="text-xs text-ink/50" x-text="detail.tipeGaji === 'Harian' ? 'Upah harian' : 'Gaji pokok'"></dt><dd class="font-medium tabular-nums" x-text="fmt(detail.tipeGaji === 'Harian' ? detail.gaji.upahHarian : detail.gaji.pokok)"></dd></div>
                <div><dt class="text-xs text-ink/50">Tunjangan tetap (jabatan + lokasi)</dt><dd class="font-medium tabular-nums" x-text="fmt((detail.gaji.tunjJabatan || 0) + lokById(detail.lokasiId).tunjangan)"></dd></div>
                <div><dt class="text-xs text-ink/50">Makan + transport / hari</dt><dd class="font-medium tabular-nums" x-text="fmt((detail.gaji.makan || 0) + (detail.gaji.transport || 0))"></dd></div>
                <div><dt class="text-xs text-ink/50">Upah lembur / jam</dt><dd class="font-medium tabular-nums" x-text="fmt(upahJam(detail))"></dd></div>
                <div class="col-span-2"><dt class="text-xs text-ink/50">Rekening</dt><dd class="font-medium" x-text="detail.bank + ' · ' + detail.rekening + ' a.n. ' + detail.atasNama"></dd></div>
              </dl>
            </div>
          </template>
          <div class="flex flex-wrap gap-2 sm:col-span-2">
            <button x-show="can('emp.edit') || can('emp.gaji')" @click="openEmp(detail)" class="btn-dark"><i class="fa-solid fa-pen"></i> Ubah data</button>
            <button x-show="can('emp.edit')" @click="toggleEmpStatus(detail)" class="btn-light" x-text="detail.status === 'Aktif' ? 'Nonaktifkan' : 'Aktifkan'"></button>
          </div>
        </div>
        <div x-show="detailTab === 'absensi'" class="space-y-4">
          <select x-model="period" class="input w-auto"><template x-for="p in periodOptions.filter(p => p <= curPeriod)"><option :value="p" x-text="'Periode ' + pLabel(p)"></option></template></select>
          <template x-for="s in (detailTab === 'absensi' ? [empSummary(detail, period)] : [])">
            <div class="space-y-4">
              <div class="grid grid-cols-3 gap-2 text-center sm:grid-cols-6"><template x-for="k in [['Jadwal', s.jadwal], ['Hadir', s.hadir], ['Terlambat', s.terlambat], ['Alpa', s.alpa], ['I/S/C', s.izin + s.sakit + s.cuti], ['Lembur', num(s.lembur.reduce((a, r) => a + r.ot, 0)) + 'j']]"><div class="bg-surface p-2"><p class="text-[10px] text-ink/50" x-text="k[0]"></p><p class="font-semibold tabular-nums" x-text="k[1]"></p></div></template></div>
              <a :href="runOf(period) ? printUrl('absensi', runOf(period), detail.id) : '#'" target="_blank" x-show="runOf(period)" class="btn-light btn-sm"><i class="fa-solid fa-print"></i> Cetak kartu absensi</a>
              <table class="w-full text-sm"><tbody class="divide-y divide-black/5"><template x-for="d in [...s.days].reverse()" :key="d.ds"><tr :class="!d.sched && 'text-ink/50'"><td class="py-2 pr-3 whitespace-nowrap" x-text="fmtDay(d.ds)"></td><td class="py-2 pr-3 font-mono text-xs" x-text="(d.masuk || '—') + ' – ' + (d.pulang || '—')"></td><td class="py-2 pr-3 text-xs" x-text="d.ot ? num(d.ot) + ' j lembur' : ''"></td><td class="py-2 text-right"><span class="badge" :class="stCls(d.status)" x-text="d.status"></span></td></tr></template></tbody></table>
            </div>
          </template>
        </div>
        <div x-show="detailTab === 'slip'" class="space-y-2">
          <template x-for="x in empSlips(detail)" :key="x.run.id"><div class="flex items-center gap-3 bg-surface p-3 text-sm"><span class="flex-1 font-medium" x-text="pLabel(x.run.period)"></span><span class="badge" :class="runSt(x.run.status).cls" x-text="x.run.status"></span><span class="w-32 text-right font-semibold tabular-nums" x-text="fmt(x.line.thp)"></span><a :href="printUrl('slip', x.run, detail.id)" target="_blank" class="btn-icon"><i class="fa-solid fa-print"></i></a></div></template>
          <p x-show="!empSlips(detail).length" class="text-sm text-ink/50">Belum ada riwayat payroll.</p>
        </div>
      </div>
    </div>
  </div>
</template>

<!-- =============================================================== MODAL: DETAIL HARI -->
<template x-for="dm in (dayModal && dayInfo ? [{ ...dayModal, info: dayInfo }] : [])">
  <div class="modal-wrap" @keydown.escape.window="dayModal = null">
    <div class="modal max-w-xl" @click.outside="dayModal = null">
      <div class="flex items-start justify-between border-b border-black/5 px-6 py-4"><div><h2 class="font-semibold" x-text="dm.emp.nama"></h2><p class="text-xs text-ink/50" x-text="fmtDay(dm.ds) + ' · ' + dm.info.j.kode + ' (' + dm.info.j.masuk + '–' + dm.info.j.pulang + ')'"></p></div><button @click="dayModal = null" class="btn-icon"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="space-y-5 p-6">
        <div class="grid grid-cols-2 gap-3 text-sm sm:grid-cols-4">
          <div><p class="text-xs text-ink/50">Status</p><span class="badge mt-1" :class="stCls(dm.info.r.status)" x-text="dm.info.r.status"></span></div>
          <div><p class="text-xs text-ink/50">Masuk – pulang</p><p class="font-mono font-medium" x-text="(dm.info.r.masuk || '—') + ' – ' + (dm.info.r.pulang || '—')"></p></div>
          <div><p class="text-xs text-ink/50">Terlambat</p><p class="font-medium" x-text="dm.info.r.late ? dm.info.r.late + ' menit' : '—'"></p></div>
          <div><p class="text-xs text-ink/50">Lembur</p><p class="font-medium" x-text="dm.info.r.ot ? num(dm.info.r.ot) + ' j · ' + dm.info.r.otStatus : '—'"></p></div>
        </div>
        <div>
          <p class="mb-2 text-xs font-semibold uppercase tracking-widest text-ink/40">Log scan</p>
          <ul class="divide-y divide-black/5 ring-1 ring-black/5">
            <template x-for="s in dm.info.scans" :key="s.id"><li class="flex items-center gap-3 px-3 py-2 text-sm"><i class="fa-solid text-navy" :class="s.verify === 'Manual' ? 'fa-pen' : 'fa-barcode'"></i><span class="font-mono font-medium" x-text="s.t.slice(11)"></span><span class="flex-1 text-xs text-ink/50" x-text="devById(s.dev).nama + ' · ' + s.src + (s.oleh ? ' oleh ' + s.oleh : '')"></span><button x-show="can('absen.edit') && s.src === 'Manual'" @click="removeScan(s)" class="btn-icon"><i class="fa-solid fa-trash-can text-xs"></i></button></li></template>
            <li x-show="!dm.info.scans.length" class="px-3 py-3 text-sm text-ink/50">Tidak ada scan.</li>
          </ul>
        </div>
        <template x-if="can('absen.edit')">
          <div class="space-y-3 bg-surface p-4">
            <p class="text-xs font-semibold uppercase tracking-widest text-ink/40">Koreksi operator</p>
            <form @submit.prevent="addManualScan()" class="flex gap-2"><input type="time" x-model="manualTime" class="input w-auto"><button class="btn-dark"><i class="fa-solid fa-plus"></i> Tambah scan manual</button></form>
            <div x-show="!dm.info.leave && dm.info.r.sched" class="flex flex-wrap gap-2"><span class="self-center text-xs text-ink/50">Tandai sebagai:</span><template x-for="j in ['Izin','Sakit','Cuti','Dinas']"><button @click="setDayLeave(j)" class="btn-light btn-sm" x-text="j"></button></template></div>
            <p x-show="dm.info.leave" class="text-xs text-ink/60" x-text="'Tercatat ' + dm.info.leave?.jenis + ' (' + dm.info.leave?.status + '): ' + dm.info.leave?.ket"></p>
            <a x-show="dm.info.r.ot" href="#lembur" @click="dayModal = null; otStatus = ''" class="block text-xs font-medium text-navy hover:underline">Kelola persetujuan lembur →</a>
          </div>
        </template>
      </div>
    </div>
  </div>
</template>

<!-- =============================================================== MODAL: IZIN -->
<template x-if="leaveModal">
  <div class="modal-wrap" @keydown.escape.window="leaveModal = false">
    <form class="modal max-w-lg p-6" @submit.prevent="saveLeave()" @click.outside="leaveModal = false">
      <h2 class="font-semibold" x-text="session.role === 'karyawan' ? 'Ajukan izin / sakit / cuti' : 'Catat izin / sakit / cuti'"></h2>
      <div class="mt-5 grid gap-4 sm:grid-cols-2">
        <label class="sm:col-span-2" x-show="session.role !== 'karyawan'"><span class="label">Karyawan</span><select x-model="leaveForm.empId" class="input"><template x-for="e in activeEmps"><option :value="e.id" x-text="e.nama + ' — ' + e.nik" :selected="e.id === leaveForm.empId"></option></template></select></label>
        <label class="sm:col-span-2"><span class="label">Jenis</span><select x-model="leaveForm.jenis" class="input"><option>Izin</option><option>Sakit</option><option>Cuti</option><option>Dinas</option></select></label>
        <label><span class="label">Dari</span><input type="date" x-model="leaveForm.dari" class="input"></label>
        <label><span class="label">Sampai</span><input type="date" x-model="leaveForm.sampai" class="input"></label>
        <label class="sm:col-span-2"><span class="label">Keterangan</span><textarea x-model="leaveForm.ket" rows="3" class="input"></textarea></label>
      </div>
      <div class="mt-6 flex justify-end gap-2"><button type="button" @click="leaveModal = false" class="btn-light">Batal</button><button class="btn-primary" x-text="session.role === 'karyawan' || !can('leave.approve') ? 'Kirim pengajuan' : 'Simpan (disetujui)'"></button></div>
    </form>
  </div>
</template>

<!-- =============================================================== MODAL: JADWAL -->
<template x-if="jadwalModal">
  <div class="modal-wrap" @keydown.escape.window="jadwalModal = false">
    <form class="modal max-w-2xl p-6" @submit.prevent="saveJadwal()" @click.outside="jadwalModal = false">
      <h2 class="font-semibold" x-text="jadwalForm.id ? 'Ubah skema kerja' : 'Skema kerja baru'"></h2>
      <div class="mt-5 grid gap-4 sm:grid-cols-3">
        <label><span class="label">Kode</span><input x-model="jadwalForm.kode" class="input font-mono"></label>
        <label class="sm:col-span-2"><span class="label">Nama</span><input x-model="jadwalForm.nama" class="input"></label>
        <label><span class="label">Pola</span><select x-model="jadwalForm.pola" class="input"><option value="mingguan">Mingguan (hari tetap)</option><option value="siklus">Siklus / roster bergulir</option></select></label>
        <div class="sm:col-span-2" x-show="jadwalForm.pola === 'mingguan'"><span class="label">Hari kerja</span><div class="flex flex-wrap gap-1"><template x-for="(h, i) in ['Min','Sen','Sel','Rab','Kam','Jum','Sab']"><button type="button" @click="toggleHari(jadwalForm, i)" class="seg ring-1 ring-black/10" :class="jadwalForm.hari.includes(i) ? 'bg-navy text-white' : 'bg-white'" x-text="h"></button></template></div></div>
        <div class="grid grid-cols-3 gap-2 sm:col-span-2" x-show="jadwalForm.pola === 'siklus'"><label><span class="label">Hari kerja</span><input type="number" x-model="jadwalForm.siklusKerja" class="input"></label><label><span class="label">Hari libur</span><input type="number" x-model="jadwalForm.siklusLibur" class="input"></label><label><span class="label">Tgl acuan</span><input type="date" x-model="jadwalForm.anchor" class="input"></label></div>
        <label><span class="label">Jam masuk</span><input type="time" x-model="jadwalForm.masuk" class="input"></label>
        <label><span class="label">Jam pulang</span><input type="time" x-model="jadwalForm.pulang" class="input"></label>
        <label><span class="label">Istirahat (menit)</span><input type="number" x-model="jadwalForm.istirahat" class="input"></label>
        <label><span class="label">Hari kerja / minggu (pengali libur)</span><select x-model.number="jadwalForm.mingguKerja" class="input"><option :value="6" :selected="jadwalForm.mingguKerja == 6">6 hari</option><option :value="5" :selected="jadwalForm.mingguKerja == 5">5 hari</option></select></label>
        <label><span class="label">Pembagi upah harian</span><input type="number" x-model="jadwalForm.hariKerjaBulan" class="input"></label>
        <div class="text-sm"><span class="label">Jam reguler (otomatis)</span><p class="py-2.5 font-semibold" x-text="num(jadwalJam(jadwalForm)) + ' jam/hari'"></p></div>
        <label class="sm:col-span-3"><span class="label">Keterangan</span><input x-model="jadwalForm.keterangan" class="input"></label>
      </div>
      <div class="mt-6 flex justify-end gap-2"><button type="button" @click="jadwalModal = false" class="btn-light">Batal</button><button class="btn-primary">Simpan</button></div>
    </form>
  </div>
</template>

<!-- =============================================================== MODAL: PENGGUNA -->
<template x-if="userModal">
  <div class="modal-wrap" @keydown.escape.window="userModal = false">
    <form class="modal max-w-lg p-6" @submit.prevent="saveUser()" @click.outside="userModal = false">
      <h2 class="font-semibold" x-text="userForm.id ? 'Ubah pengguna' : 'Pengguna baru'"></h2>
      <div class="mt-5 grid gap-4">
        <label><span class="label">Nama</span><input x-model="userForm.nama" class="input"></label>
        <label><span class="label">Email (login)</span><input type="email" x-model="userForm.email" class="input"></label>
        <label><span class="label">Peran</span><select x-model="userForm.role" class="input"><template x-for="(r, k) in roles" :key="k"><option :value="k" x-text="r.nama" :selected="k === userForm.role"></option></template></select></label>
        <label><span class="label">Tautkan ke data karyawan <span x-show="userForm.role === 'karyawan'">*</span></span><select x-model="userForm.empId" class="input"><option value="">— tidak ditautkan —</option><template x-for="e in db.employees"><option :value="e.id" x-text="e.nama + ' (' + e.nik + ')'" :selected="e.id === userForm.empId"></option></template></select></label>
        <label><span class="label">Kata sandi (simulasi)</span><input x-model="userForm.password" class="input font-mono"></label>
        <label class="flex items-center gap-2 text-sm"><input type="checkbox" x-model="userForm.aktif"> Akun aktif</label>
      </div>
      <div class="mt-6 flex justify-end gap-2"><button type="button" @click="userModal = false" class="btn-light">Batal</button><button class="btn-primary">Simpan</button></div>
    </form>
  </div>
</template>

<!-- =============================================================== MODAL: IMPORT LOG SCANNER -->
<template x-if="importModal">
  <div class="modal-wrap" @keydown.escape.window="importModal = false">
    <div class="modal max-w-3xl p-6" @click.outside="importModal = false">
      <h2 class="font-semibold">Import log dari scanner offline</h2>
      <p class="text-sm text-ink/60">Untuk lokasi tanpa jaringan (mis. portal underground): scanner genggam menyimpan hasil scan, lalu file diekspor (CSV/TXT) dan diunggah di sini. Format per baris: <code class="font-mono">NO_KARTU;YYYY-MM-DD HH:MM:SS</code></p>
      <div class="mt-4 flex flex-wrap items-center gap-2">
        <select x-model="importDev" class="input w-auto"><template x-for="d in db.devices"><option :value="d.id" x-text="d.id + ' — ' + d.nama" :selected="d.id === importDev"></option></template></select>
        <label class="btn-light cursor-pointer"><i class="fa-solid fa-upload"></i> Pilih file<input type="file" accept=".csv,.txt" @change="importFile($event)" class="hidden"></label>
        <button @click="sampleAttlog()" class="btn-light"><i class="fa-solid fa-wand-magic-sparkles"></i> Isi contoh</button>
      </div>
      <textarea x-model="importText" rows="6" class="input mt-3 font-mono text-xs" placeholder="YBM101001;2026-11-05 05:42:12"></textarea>
      <div x-show="importPreview.length" class="mt-3 max-h-52 overflow-y-auto ring-1 ring-black/5">
        <table class="w-full text-xs"><tbody class="divide-y divide-black/5"><template x-for="(x, i) in importPreview" :key="i"><tr><td class="px-3 py-1.5 font-mono" x-text="x.raw"></td><td class="px-3 py-1.5" x-text="x.emp ? x.emp.nama : ''"></td><td class="px-3 py-1.5 text-right"><span class="badge" :class="!x.ok || !x.emp ? 'bg-red-50 text-red-700 ring-red-600/20' : x.dup ? 'bg-slate-100 text-slate-600 ring-slate-500/20' : 'bg-emerald-50 text-emerald-700 ring-emerald-600/20'" x-text="!x.ok ? 'Format salah' : !x.emp ? (x.alasan || 'Tidak dikenal') : x.dup ? 'Duplikat' : 'Siap diimpor'"></span></td></tr></template></tbody></table>
      </div>
      <div class="mt-6 flex justify-end gap-2"><button @click="importModal = false" class="btn-light">Batal</button><button @click="doImport()" class="btn-primary"><i class="fa-solid fa-file-import"></i> Import <span x-text="importPreview.filter(x => x.ok && x.emp && !x.dup).length"></span> log</button></div>
    </div>
  </div>
</template>

<!-- =============================================================== MODAL: PENYESUAIAN -->
<template x-if="adjModal">
  <div class="modal-wrap" @keydown.escape.window="adjModal = false">
    <form class="modal max-w-lg p-6" @submit.prevent="saveAdj()" @click.outside="adjModal = false">
      <h2 class="font-semibold">Penyesuaian gaji — <span x-text="pLabel(adjForm.period)"></span></h2>
      <div class="mt-5 grid gap-4">
        <label><span class="label">Karyawan</span><select x-model="adjForm.empId" class="input"><template x-for="l in runOf(adjForm.period).lines"><option :value="l.empId" x-text="l.nama" :selected="l.empId === adjForm.empId"></option></template></select></label>
        <div class="grid grid-cols-2 gap-1 rounded-md bg-surface p-1"><template x-for="j in ['Pendapatan','Potongan']"><button type="button" @click="adjForm.jenis = j" class="seg" :class="adjForm.jenis === j ? 'bg-white shadow-sm' : 'text-ink/60'" x-text="j === 'Pendapatan' ? '+ Pendapatan' : '− Potongan'"></button></template></div>
        <label><span class="label">Nama komponen</span><input x-model="adjForm.nama" list="adj-names" class="input" placeholder="mis. Insentif kinerja, Kasbon"><datalist id="adj-names"><option>Insentif Kinerja</option><option>Bonus Safety Award</option><option>Rapel Kenaikan Gaji</option><option>Cicilan Kasbon</option><option>Potongan Koperasi</option><option>Potongan Kerusakan Alat</option></datalist></label>
        <label><span class="label">Nilai (Rp)</span><input type="number" x-model="adjForm.nilai" class="input"></label>
      </div>
      <div class="mt-6 flex justify-end gap-2"><button type="button" @click="adjModal = false" class="btn-light">Batal</button><button class="btn-primary">Simpan &amp; hitung ulang</button></div>
    </form>
  </div>
</template>

<!-- =============================================================== MODAL: CATATAN STATUS PAYROLL -->
<template x-for="nm in (noteModal ? [noteModal] : [])">
  <div class="modal-wrap" @keydown.escape.window="noteModal = null">
    <form class="modal max-w-lg p-6" @submit.prevent="submitNote()" @click.outside="noteModal = null">
      <h2 class="font-semibold" x-text="{ Diajukan: 'Ajukan payroll ke Pimpinan', Disetujui: 'Setujui payroll', Ditolak: 'Kembalikan payroll ke Keuangan', Dibayar: 'Tandai payroll sudah dibayar' }[nm.status]"></h2>
      <div class="mt-4 grid grid-cols-2 gap-3 bg-surface p-4 text-sm"><div><p class="text-xs text-ink/50">Periode</p><p class="font-medium" x-text="pLabel(nm.run.period)"></p></div><div><p class="text-xs text-ink/50">Karyawan</p><p class="font-medium" x-text="nm.run.totals.karyawan"></p></div><div><p class="text-xs text-ink/50">Take home pay</p><p class="font-medium tabular-nums" x-text="fmt(nm.run.totals.thp)"></p></div><div><p class="text-xs text-ink/50">Biaya perusahaan</p><p class="font-medium tabular-nums" x-text="fmt(nm.run.totals.biaya)"></p></div></div>
      <label class="mt-4 block"><span class="label" x-text="nm.status === 'Ditolak' ? 'Alasan (wajib)' : 'Catatan'"></span><textarea x-model="nm.text" rows="3" class="input"></textarea></label>
      <p x-show="nm.status === 'Disetujui'" class="mt-3 text-xs text-ink/50"><i class="fa-solid fa-stamp"></i> Persetujuan tercatat di lembar pengesahan dengan nama &amp; waktu Anda.</p>
      <div class="mt-6 flex justify-end gap-2"><button type="button" @click="noteModal = null" class="btn-light">Batal</button><button :class="nm.status === 'Ditolak' ? 'btn-danger' : nm.status === 'Diajukan' ? 'btn-primary' : 'btn-ok'" x-text="{ Diajukan: 'Ajukan', Disetujui: 'Setujui', Ditolak: 'Kembalikan', Dibayar: 'Tandai dibayar' }[nm.status]"></button></div>
    </form>
  </div>
</template>

<!-- =============================================================== MODAL: RINCIAN SLIP -->
<template x-for="ld in (lineDetail ? [lineDetail] : [])">
  <div class="modal-wrap" @keydown.escape.window="lineDetail = null">
    <div class="modal max-w-2xl" @click.outside="lineDetail = null">
      <div class="flex items-start justify-between border-b border-black/5 px-6 py-4"><div><h2 class="font-semibold" x-text="ld.nama"></h2><p class="text-xs text-ink/50" x-text="ld.nik + ' · ' + ld.jabatan + ' · ' + ld.jadwal"></p></div><button @click="lineDetail = null" class="btn-icon"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="max-h-[70vh] space-y-5 overflow-y-auto p-6 text-sm">
        <div x-show="ld.peringatan.length" class="bg-amber-50 p-3 text-amber-900"><template x-for="w in ld.peringatan"><p><i class="fa-solid fa-triangle-exclamation"></i> <span x-text="w"></span></p></template></div>
        <div class="grid gap-5 sm:grid-cols-2">
          <div><p class="mb-2 text-xs font-semibold uppercase tracking-widest text-emerald-700">Pendapatan</p><template x-for="p in ld.pendapatan"><div class="flex justify-between gap-3 py-1"><span><span x-text="p.nama"></span><span class="block text-[11px] text-ink/50" x-text="p.ket"></span></span><span class="tabular-nums" x-text="fmt(p.nilai)"></span></div></template><div class="mt-2 flex justify-between border-t border-black/10 pt-2 font-semibold"><span>Total</span><span class="tabular-nums" x-text="fmt(ld.totalPendapatan)"></span></div></div>
          <div><p class="mb-2 text-xs font-semibold uppercase tracking-widest text-red-700">Potongan</p><template x-for="p in ld.potongan"><div class="flex justify-between gap-3 py-1"><span><span x-text="p.nama"></span><span class="block text-[11px] text-ink/50" x-text="p.ket"></span></span><span class="tabular-nums" x-text="fmt(p.nilai)"></span></div></template><div class="mt-2 flex justify-between border-t border-black/10 pt-2 font-semibold"><span>Total</span><span class="tabular-nums" x-text="fmt(ld.totalPotongan)"></span></div></div>
        </div>
        <div class="flex items-center justify-between bg-ink p-4 text-white"><span>Take home pay</span><span class="text-2xl font-light tabular-nums" x-text="fmt(ld.thp)"></span></div>
        <div x-show="ld.lembur.length"><p class="mb-2 text-xs font-semibold uppercase tracking-widest text-ink/40">Rincian lembur (upah/jam <span x-text="fmt(ld.upahJam)"></span>)</p>
          <table class="w-full text-xs"><thead><tr class="text-left text-ink/50"><th class="py-1">Tanggal</th><th>Jenis</th><th>Jam</th><th>Pengali</th><th class="text-right">Ekuivalen</th><th class="text-right">Nilai</th></tr></thead><tbody class="divide-y divide-black/5"><template x-for="o in ld.lembur"><tr><td class="py-1.5" x-text="fmtDay(o.ds)"></td><td x-text="o.jenis"></td><td x-text="num(o.jam)"></td><td x-text="o.rincian.map(x => num(x.jam) + '×' + num(x.kali)).join(' + ')"></td><td class="text-right" x-text="num(o.ekuivalen)"></td><td class="text-right tabular-nums" x-text="fmt(o.nilai)"></td></tr></template></tbody></table>
        </div>
        <div><p class="mb-2 text-xs font-semibold uppercase tracking-widest text-ink/40">Beban perusahaan (tidak memotong gaji)</p><template x-for="p in ld.perusahaan"><div class="flex justify-between py-1"><span x-text="p.nama + ' ' + p.ket"></span><span class="tabular-nums" x-text="fmt(p.nilai)"></span></div></template></div>
      </div>
    </div>
  </div>
</template>

<!-- =============================================================== KONFIRMASI & TOAST -->
<template x-if="confirmBox.show">
  <div class="modal-wrap z-[70] items-center" @keydown.escape.window="confirmBox.show = false">
    <div class="modal max-w-md p-6" @click.outside="confirmBox.show = false">
      <p class="font-semibold">Konfirmasi</p><p class="mt-2 text-sm text-ink/70" x-text="confirmBox.text"></p>
      <div class="mt-6 flex justify-end gap-2"><button @click="confirmBox.show = false" class="btn-light">Batal</button><button @click="confirmYes()" class="btn-dark">Ya, lanjutkan</button></div>
    </div>
  </div>
</template>
<div class="pointer-events-none fixed bottom-4 right-4 z-[80] flex w-full max-w-sm flex-col gap-2" aria-live="polite">
  <template x-for="t in toasts" :key="t.id">
    <div x-transition class="pointer-events-auto flex items-start gap-3 bg-ink px-4 py-3 text-sm text-white shadow-xl" :class="t.type === 'error' && 'bg-red-600'">
      <i class="fa-solid mt-0.5" :class="t.type === 'error' ? 'fa-circle-exclamation' : t.type === 'scan' ? 'fa-barcode text-sky' : t.type === 'info' ? 'fa-circle-info text-sky' : 'fa-circle-check text-emerald-400'"></i><span x-text="t.text"></span>
    </div>
  </template>
</div>

</div>
</template>
</body>
</html>
